services:
  postgres:
    image: postgres:17
    container_name: si-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: si_platform
      POSTGRES_USER: si_user
      POSTGRES_PASSWORD: si_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U si_user -d si_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
